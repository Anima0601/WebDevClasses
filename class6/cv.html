<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Cv</h1>
    <div>
        <h2>Name:</h2>
        <div id="nameDisplay"></div>

</body>

<script>

    const nameForm = para.get("nameForm");

    document.getElementById("nameDisplay").textContent=nameForm||"invalid data";
</script>

</html>
