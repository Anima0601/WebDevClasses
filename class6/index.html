<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Form</title>
</head>
<body>
    <form>
        <div>
            <label id="name">Enter your name:</label>
            <input type="text" placeholder="enter your name">
        </div>
        <div>
            <label id="dob">Enter DOB:</label>
            <input type="date" placeholder="enter date of birth">
        </div>
        <div>
            <label id="phoneno">Enter your phone number:</label>
            <input type="text" placeholder="enter phone number">
        </div>

        <button id="onSubmit" onclick="window.location.href='cv.html';">Submit</button>
    </form>
</body>


<script>
const nameForm = document.getElementById("name").value;
window.location.href=`cv.html?nameform=${encodeURIComponent(nameForm)}`;
</script>
</html>
