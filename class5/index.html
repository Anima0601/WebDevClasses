<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elegant Jewellery</title>
    <style>
        /* General Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: #f9f5f0;
            color: #333;
        }

        header {
            background: linear-gradient(90deg, #e3c4a8, #d1a58f);
            padding: 20px;
            text-align: center;
            color: #fff;
        }

        header h1 {
            font-size: 3rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        nav {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
        }

        nav a {
            text-decoration: none;
            color: #fff;
            font-size: 1.2rem;
            padding: 10px 15px;
            background: #d1a58f;
            border-radius: 5px;
            transition: background 0.3s;
        }

        nav a:hover {
            background: #b97d66;
        }

        /* Hero Section */
        .hero {
            background: url('heropagephoto.jpg') center/cover no-repeat;
            height: 70vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.7);
        }

        .hero h2 {
            font-size: 4rem;
        }

        .hero p {
            font-size: 1.5rem;
        }

        /* Product Grid */
        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            padding: 40px;
        }

        .product {
            border: 1px solid #d1a58f;
            border-radius: 10px;
            overflow: hidden;
            background-color: #fff;
            transition: transform 0.3s;
        }

        .product:hover {
            transform: scale(1.05);
        }

        .product img {
            width: 100%;
            height: 600px;
            object-fit: cover;
        }

        .product-info {
            padding: 15px;
            text-align: center;
        }

        .product-info h3 {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        .product-info p {
            color: #666;
            margin-bottom: 10px;
        }

        .product-info button {
            background-color: #d1a58f;
            border: none;
            padding: 10px 20px;
            color: #fff;
            cursor: pointer;
            border-radius: 5px;
            transition: background 0.3s;
        }

        .product-info button:hover {
            background-color: #b97d66;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 20px;
            background-color: #333;
            color: #fff;
            margin-top: 40px;
        }

        footer a {
            color: #d1a58f;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <header>
        <h1>Elegant Jewellery</h1>
        <nav>
            <a href="#home">Home</a>
            <a href="#products">Products</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <section class="hero" id="home">
        <div>
            <h2>Timeless Elegance</h2>
            <p>Discover our exquisite collection of jewellery</p>
        </div>
    </section>

    <section class="products" id="products">
        <div class="product">
            <img src="premium_photo-1671641737541-714de143f6c7.avif" alt="Ring">
            <div class="product-info">
                <h3>Golden Ring</h3>
                <p>$499</p>
                <button>Add to Cart</button>
            </div>
        </div>
        <div class="product">
            <img src="necklace.avif" alt="Necklace">
            <div class="product-info">
                <h3>Diamond Necklace</h3>
                <p>$1299</p>
                <button>Add to Cart</button>
            </div>
        </div>
        <div class="product">
            <img src="earring.avif" alt="Earrings">
            <div class="product-info">
                <h3>Elegant Earrings</h3>
                <p>$299</p>
                <button>Add to Cart</button>
            </div>
        </div>
    </section>

    <footer id="contact">
        <p>&copy; 2024 Elegant Jewellery | Designed by Anima</p>
        <p><a href="mailto:contact@elegantjewellery.com">Email Us</a></p>
    </footer>

    <script>
        // Interactive Button Alert
        document.querySelectorAll('.product button').forEach(button => {
            button.addEventListener('click', () => {
                alert('Item added to cart!');
            });
        });
    </script>
</body>
</html>
