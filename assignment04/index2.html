<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style2.css">
    
    <title>Document</title>
</head>
<body>
    <div class="container" id="id-card">
        <form>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name"><br><br>
            
            <label for="rollno">Roll Number</label>
            <input type="number" id="rollno" placeholder="2400XXXXXXX"><br><br>
            
            <label for="dateofbirth">Date of Birth</label>
            <input type="date" id="dob"><br><br>

            <label for="bgrp">Blood Group</label>
            <input type="text" id="bloodgroup"><br><br>

            <label for="pfp">Profile Photo</label>
            <input type="file" id="profilephoto"><br><br>
            
            <input type="submit" value="Submit">
        </form>
    </div>
    <script src="script2.js"></script>
</body>
</html>
